name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      - run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/markvault-clipper-browser-extension.zip .
      - run: |
          mkdir -p dist/server-package
          cp -r server dist/server-package/server
          cp Dockerfile docker-compose.example.yml dist/server-package/
          cd dist/server-package
          zip -r ../markvault-clipper-server.zip .
      - run: |
          zip -r dist/markvault-clipper-full-source.zip . \
            -x "node_modules/*" "dist/*" ".git/*"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/markvault-clipper-browser-extension.zip
            dist/markvault-clipper-server.zip
            dist/markvault-clipper-full-source.zip
