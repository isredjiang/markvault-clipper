<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MarkVault Clipper</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="popup">
      <header class="app-header">
        <div class="brand-mark">M</div>
        <div>
          <strong>MarkVault Clipper</strong>
          <span data-i18n="appTagline">Web to Vault</span>
        </div>
      </header>

      <button id="clip" class="primary" data-i18n="clipButton">&#33258;&#21160;&#21098;&#34255;</button>

      <label>
        <span data-i18n="templateLabel">&#27169;&#26495;</span>
        <select id="templateSelect"></select>
      </label>

      <label>
        <span data-i18n="templateNameLabel">&#27169;&#26495;&#21517;&#31216;</span>
        <input id="templateName" type="text" placeholder="&#40664;&#35748;" data-i18n-placeholder="templateNamePlaceholder">
      </label>

      <label>
        <span data-i18n="vaultNameLabel">&#24211;&#21517;&#31216;</span>
        <input id="vaultName" type="text" placeholder="MyVault">
      </label>

      <label>
        <span data-i18n="folderLabel">&#21098;&#34255;&#36335;&#24452;</span>
        <input id="folder" type="text" placeholder="_webClipper">
      </label>

      <label>
        <span data-i18n="assetsFolderLabel">&#36164;&#28304;&#36335;&#24452;</span>
        <input id="assetsFolder" type="text" placeholder="_webClipper/assets">
      </label>

      <label>
        <span data-i18n="tagsLabel">&#26631;&#31614;</span>
        <input id="tags" type="text" placeholder="AI, docs" data-i18n-placeholder="tagsPlaceholder">
      </label>

      <label class="switch-row compact">
        <span data-i18n="selectionLabel">&#20165;&#21098;&#34255;&#36873;&#20013;&#25991;&#26412;</span>
        <input id="useSelection" type="checkbox">
      </label>

      <label class="switch-row compact">
        <span data-i18n="resourcesLabel">&#19979;&#36733;&#36164;&#28304;</span>
        <input id="localizeImages" type="checkbox">
      </label>

      <div class="button-row">
        <button id="saveTemplate" class="secondary" data-i18n="saveTemplateButton">&#20445;&#23384;&#27169;&#26495;</button>
        <button id="deleteTemplate" class="danger" data-i18n="deleteButton">&#21024;&#38500;</button>
      </div>

      <button id="preview" class="secondary" data-i18n="previewButton">&#39044;&#35272; Markdown</button>
      <button id="copyPreview" class="secondary" data-i18n="copyButton" hidden>&#22797;&#21046; Markdown</button>
      <button id="downloadMarkdown" class="secondary" data-i18n="downloadButton">&#19979;&#36733; Markdown</button>

      <div class="divider"></div>

      <label>
        <span>URL</span>
        <input id="serverUrl" type="url" placeholder="https://clipper.example.com">
      </label>

      <label>
        <span data-i18n="tokenLabel">&#20196;&#29260;</span>
        <input id="token" type="password">
      </label>

      <label>
        <span data-i18n="languageLabel">&#35821;&#35328;</span>
        <select id="language">
          <option value="zh-CN">&#31616;&#20307;&#20013;&#25991;</option>
          <option value="en">English</option>
        </select>
      </label>

      <button id="saveConnection" class="secondary" data-i18n="saveConnectionButton">&#20445;&#23384;&#36830;&#25509;</button>
      <button id="test" class="secondary" data-i18n="testButton">&#27979;&#35797;&#36830;&#25509;</button>

      <section id="status"></section>
      <textarea id="previewBox" readonly hidden></textarea>
    </main>
    <script src="popup.bundle.js"></script>
  </body>
</html>
